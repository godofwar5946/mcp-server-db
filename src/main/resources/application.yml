server:
  port: ${MCP_PORT:8080}

spring:
  application:
    name: mcp-server-db
  ai:
    mcp:
      server:
        enabled: true
        name: db-mcp-server
        version: 1.1.0
        instructions: |
          多数据源数据库工具，支持 PostgreSQL/MySQL/Oracle/SQLServer。
          先列出数据源和表，再获取结构；表结构含主键、外键和索引。
          查询只接受安全解析后的 SELECT，所有对象须在 schema 白名单内。
          所有已配置的数据源均可读取，写入由每个数据源的 allow-writes 控制。
          写入通过 prepare 和 confirm 操作；confirm 需提供 approvalKey，或事先通过独立审批。
          confirm=true 不是用户批准。token 绑定身份与会话，只能执行一次。
          查询结果可能按行数、字节数或字段长度截断，请检查 limited 和 warnings。
          长文本先查字符长度，再用 SUBSTRING/SUBSTR 按偏移分段读取，或使用文本查找、替换、正则及拆分函数提取所需内容。
          PostgreSQL 拆行采用 FROM 表别名, string_to_table(字段, 分隔符) AS parts(part)，不添加 LATERAL；SQL Server 使用 CROSS APPLY STRING_SPLIT。
          PostgreSQL JSON 字段可用 jsonb_path_exists/match/query/query_array/query_first 及其 _tz 变体筛选和提取；jsonb_path_query 也可用于 FROM 中拆成多行。
        type: SYNC
        protocol: STREAMABLE
        streamable-http:
          mcp-endpoint: /mcp
          keep-alive-interval: 15s
          disallow-delete: false

app:
  security:
    # 所有客户端 token 均未配置或为空白时，HTTP 无需 Authorization。
    # 任意客户端配置 token 后，HTTP 必须提供匹配的 Bearer 密钥（至少 32 字符）。
    # 所有已配置数据源均可读取；写入要求数据源 allow-writes=true，并使用 approval-key 审批。
    clients:
      local:
        token: ${MCP_API_KEY:}
    approval-key: ${MCP_APPROVAL_KEY:}
  mcp:
    keep-alive:
      enabled: true
      ping-timeout: 20s
      cleanup-on-failure: true
  db:
    default-data-source: primary
    data-sources:
      primary:
        type: POSTGRESQL
        url: ${DB_URL:jdbc:postgresql://localhost:5432/myList?currentSchema=public}
        username: ${DB_USERNAME:mcp_reader}
        password: ${DB_PASSWORD:}
        driver-class-name: org.postgresql.Driver
        default-schema: ${DB_SCHEMA:public}
        allowed-schemas:
          - ${DB_SCHEMA:public}
        allow-writes: false
    pool:
      initial-size: 0
      min-idle: 0
      max-active: 20
      max-wait: 10s
      connect-timeout: 10s
      socket-timeout: 35s
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
    schema-cache-ttl: 20m
    schema-cache-max-size: 5000
    table-list-max-rows: 200
    schema-fetch-parallelism: 4
    schema-queue-capacity: 200
    schema-batch-max-tables: 50
    schema-batch-timeout: 35s
    query-max-rows: 500
    query-timeout-seconds: 30
    query-fetch-size: 100
    sql-max-length: 65536
    result-max-bytes: 1048576
    field-max-length: 16384
    pending-sql-ttl: 10m
    pending-sql-max-size: 1000
    allow-ddl: false
    allow-full-table-write: false
    audit-include-sql: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    db:
      enabled: false
